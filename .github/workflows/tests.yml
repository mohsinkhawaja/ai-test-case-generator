name: Generator QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - name: Generate and verify fixture drafts
        run: |
          python -m caseforge examples/requirements.json --provider fixture --fixture examples/recorded-drafts.json > draft-cases.json
          python -c "import json; assert len(json.load(open('draft-cases.json'))['cases']) == 6"
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-drafts
          path: draft-cases.json
